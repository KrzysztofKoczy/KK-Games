<ion-content [fullscreen]="true">
  <div class="container">
    <ion-card>
      <ion-card-header>
        <ion-card-title>Zaloguj się</ion-card-title>
      </ion-card-header>
      <ion-card-content>

      <form [formGroup]="form" (ngSubmit)="submit()">
          <ion-input labelPlacement="floating" helperText="Wpisz swój email" errorText="Niepoprawny email" label="Email" formControlName="email" type="email" required maxlength="256"></ion-input>

          <ion-input labelPlacement="floating" helperText="Wpisz swoje hasło" label="Hasło" errorText="Niepoprawny hasło" formControlName="password" type="password" required maxlength="128"></ion-input>
  
         <ion-button expand="block" type="submit" [disabled]="form.invalid">Zaloguj się</ion-button>
 
      </form>
      <!-- @if (errorMsg()) {
        <mat-error>{{ errorMsg() }}</mat-error>
      }  -->

        <p>Funkcja logowania będzie dostępna wkrótce.</p>
        <p>Na razie możesz korzystać z trybu gościa.</p>
        
        <!-- Input na nazwę gościa -->
        <ion-item>
          <ion-label position="stacked">Nazwa użytkownika</ion-label>
          <ion-input
            [value]="guestName()"
            (ionInput)="onGuestNameChange($event)"
            placeholder="Wpisz swoją nazwę (3-256 znaków)"
            maxlength="256"
            [class.ion-invalid]="guestNameError()"
          ></ion-input>
        </ion-item>
        
        @if (guestNameError()) {
          <ion-text color="danger">
            <p class="error-text">{{ guestNameError() }}</p>
          </ion-text>
        }
        
        <ion-button expand="block" (click)="loginAsGuest()">
          Zaloguj jako gość
        </ion-button>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
