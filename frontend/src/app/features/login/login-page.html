<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Logowanie</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="container">
    <ion-card>
      <ion-card-header>
        <ion-card-title>Logowanie</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <p>Funkcja logowania będzie dostępna wkrótce.</p>
        <p>Na razie możesz korzystać z trybu gościa.</p>
        <ion-button expand="block" routerLink="/home">
          Wróć do strony głównej
        </ion-button>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
